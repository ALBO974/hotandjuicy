<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      .word { font-family: 'Poppins','Montserrat','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- ===== FLAME (simplified, 3 smooth tongues) ===== -->
  <g>
    <path fill="#ED1C24" d="
      M412 300
      C 378 290, 358 255, 368 218
      C 374 196, 390 190, 396 202
      C 392 178, 400 152, 418 132
      C 430 158, 428 172, 434 158
      C 428 128, 440 96, 465 72
      C 476 108, 470 126, 480 118
      C 478 88, 490 58, 500 46
      C 510 58, 522 88, 520 118
      C 530 126, 524 108, 535 72
      C 560 96, 572 128, 566 158
      C 572 172, 570 158, 582 132
      C 600 152, 608 178, 604 202
      C 610 190, 626 196, 632 218
      C 642 255, 622 290, 588 300
      C 552 282, 546 265, 500 265
      C 454 265, 448 282, 412 300 Z" />
    <!-- inner white flicker -->
    <path fill="#FFFFFF" d="
      M500 150
      C 518 180, 495 200, 500 225
      C 480 210, 478 175, 500 150 Z" />
  </g>

  <!-- ===== MICROPHONE ===== -->
  <g>
    <!-- white ring -->
    <rect x="396" y="270" width="208" height="320" rx="104" fill="#FFFFFF"/>
    <!-- orange capsule -->
    <rect x="412" y="286" width="176" height="288" rx="88" fill="#F7941D"/>
    <!-- grille bars -->
    <rect x="452" y="368" width="96" height="16" rx="8" fill="#171717"/>
    <rect x="452" y="418" width="96" height="16" rx="8" fill="#171717"/>
    <rect x="452" y="468" width="96" height="16" rx="8" fill="#171717"/>
    <!-- mic body outline -->
    <path fill="none" stroke="#171717" stroke-width="26" stroke-linecap="round"
      d="M370 470 C370 555, 425 610, 500 610 C575 610, 630 555, 630 470"/>
    <!-- stem -->
    <rect x="487" y="608" width="26" height="70" rx="8" fill="#171717"/>
    <!-- base -->
    <rect x="440" y="672" width="120" height="26" rx="13" fill="#171717"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g class="word" font-size="94">
    <text x="180" y="850" fill="#ED1C24">hot</text>
    <text x="360" y="850" fill="#171717">&amp;</text>
    <text x="440" y="850" fill="#171717">juicy</text>
    <!-- droplet accent above the j -->
    <path fill="#F7941D" d="M452 730 C452 745, 440 755, 428 755 C416 755, 404 745, 404 730 C404 715, 428 690, 428 690 C428 690, 452 715, 452 730 Z"/>
  </g>

  <!-- ===== PODCAST BADGE ===== -->
  <rect x="560" y="875" width="230" height="56" rx="28" fill="#ED1C24"/>
  <text x="675" y="913" text-anchor="middle" class="word" font-size="30" letter-spacing="4" fill="#FFFFFF">PODCAST</text>
</svg>